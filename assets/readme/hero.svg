<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">a3s-vec</title>
  <desc id="desc">A process-local vector database for Coding Agent workspaces, showing documents flowing through shared ordinals, vector, scalar, and full-text indexes into exact top-k results.</desc>

  <rect width="1200" height="400" rx="24" fill="#0B0D10"/>
  <path d="M56 52H600" stroke="#2B3038"/>
  <circle cx="56" cy="52" r="5" fill="#FF6B35"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="88" fill="#9AA4B2" font-size="18" letter-spacing="2">PROCESS-LOCAL RETRIEVAL / PURE RUST</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="52" y="170" fill="#F5F2EA" font-size="72" font-weight="760" letter-spacing="-3">a3s-vec</text>
    <text x="56" y="220" fill="#D6DAE0" font-size="25">Fast vector + full-text search for</text>
    <text x="56" y="255" fill="#D6DAE0" font-size="25">Coding Agent workspaces.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
