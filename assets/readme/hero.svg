    <text x="30" y="42" fill="#9AA4B2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.4">ONE SNAPSHOT / ONE ORDINAL DOMAIN</text>

