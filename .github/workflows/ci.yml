name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, lint, docs, and features
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint default features
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Lint all features
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo +stable test --locked --all-features
      - name: Run executable compatibility examples
        run: |
          cargo +stable run --locked --example crud_operations
          cargo +stable run --locked --example vector_search
          cargo +stable run --locked --example schema_builder
          cargo +stable run --locked --example retrieval_workflows
          cargo +stable run --locked --example group_by
          cargo +stable run --locked --example schema_iteration
          cargo +stable run --locked --example maintenance_health
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps --all-features

  performance:
    name: Public feature performance matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run smoke matrix and capture CSV
        env:
          A3S_VEC_BENCH_SCALE: smoke
        run: |
          mkdir -p target/performance
          cargo +stable bench --locked --bench feature_matrix --features async --quiet \
            | tee target/performance/feature-matrix.csv
      - name: Verify complete matrix metrics
        shell: bash
        run: |
          awk -F, '
            /^#/ { next }
            $1 == "operation" { next }
            NF != 10 { bad = 1; next }
            {
              if ($6 <= 0 || $6 > $7 || $7 > $8 || $9 <= 0) bad = 1
              seen[$1]++
              rows++
            }
            END {
              if (rows != 49 || bad) exit 1
              for (name in seen) if (seen[name] != 1) exit 1
            }
          ' target/performance/feature-matrix.csv
      - name: Upload feature matrix
        uses: actions/upload-artifact@v4
        with:
          name: a3s-vec-feature-matrix-${{ github.sha }}
          path: target/performance/feature-matrix.csv
          if-no-files-found: error
          retention-days: 30

  msrv:
    name: Rust 1.75 MSRV
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Test locked default feature graph
        run: cargo +1.75.0 test --locked
      - name: Test Tokio async query feature
        run: cargo +1.75.0 test --locked --features async
      - name: Check compatibility examples
        run: cargo +1.75.0 check --locked --features async --examples

  recovery-fuzz:
    name: Recovery fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-08-30 --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz persisted recovery boundaries
        run: cargo +nightly-2026-08-30 fuzz run recovery -- -runs=256 -max_len=1024

  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            deployment_target: ""
          - name: Linux arm64
            os: ubuntu-24.04-arm
            deployment_target: ""
          - name: Windows x86_64
            os: windows-2025
            deployment_target: ""
          - name: macOS arm64
            os: macos-15
            deployment_target: "15.0"
          - name: macOS Intel
            os: macos-15-intel
            deployment_target: "12.0"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run default plus Tokio async query suite
        run: cargo +stable test --locked --features async

  release-candidate:
    name: Versioned release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, performance, msrv, recovery-fuzz, platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Resolve package version
        id: package
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "a3s-vec") | .version')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build and verify locked crate package
        run: cargo +stable package --locked
      - name: Write checksum and release manifest
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          crate="target/package/a3s-vec-${PACKAGE_VERSION}.crate"
          test -f "${crate}"
          sha256sum "${crate}" > "${crate}.sha256"
          jq -n \
            --arg schema "a3s-vec-release-candidate-v1" \
            --arg version "${PACKAGE_VERSION}" \
            --arg revision "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg runner_os "${RUNNER_OS}" \
            --arg runner_arch "${RUNNER_ARCH}" \
            '{schema: $schema, version: $version, revision: $revision, run_id: $run_id, runner: {os: $runner_os, arch: $runner_arch}}' \
            > "target/package/a3s-vec-${PACKAGE_VERSION}.release.json"
      - name: Upload revision-bound candidate
        uses: actions/upload-artifact@v4
        with:
          name: a3s-vec-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            target/package/a3s-vec-${{ steps.package.outputs.version }}.crate
            target/package/a3s-vec-${{ steps.package.outputs.version }}.crate.sha256
            target/package/a3s-vec-${{ steps.package.outputs.version }}.release.json
          if-no-files-found: error
          retention-days: 30
